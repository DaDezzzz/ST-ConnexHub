<div id="cxh_api_panel" class="connexhub-panel">
    <!-- 视图切换条：ConnexHub（默认） / 原版连接 -->
    <div class="cxh-switchbar" title="切换连接管理视图（数据互相隔离）">
        <div id="cxh_tab_cxh" class="cxh-tab cxh-tab-active">
            <i class="fa-solid fa-network-wired"></i> ConnexHub
        </div>
        <div id="cxh_tab_native" class="cxh-tab">
            <i class="fa-solid fa-plug"></i> 原版连接
        </div>
    </div>

    <!-- ConnexHub 主体（native 视图时隐藏） -->
    <div id="cxh_main">
        <!-- 连接选择栏 -->
        <div class="cxh-card">
            <div class="cxh-card-title"><i class="fa-solid fa-list"></i> 连接（选中即生效）</div>
            <div class="cxh-row">
                <select id="cxh_conn_select" class="text_pole flex1"></select>
                <div id="cxh_btn_new" class="menu_button menu_button_icon" title="新建连接">
                    <i class="fa-solid fa-plus"></i>
                </div>
                <div id="cxh_btn_dup" class="menu_button menu_button_icon" title="复制连接">
                    <i class="fa-solid fa-copy"></i>
                </div>
                <div id="cxh_btn_del" class="menu_button menu_button_icon" title="删除连接">
                    <i class="fa-solid fa-trash-can"></i>
                </div>
            </div>
        </div>

        <!-- 连接编辑区 -->
        <div id="cxh_editor" class="cxh-card">
            <div class="cxh-card-title"><i class="fa-solid fa-sliders"></i> 配置</div>

            <label class="cxh-label">连接名称</label>
            <input id="cxh_name" type="text" class="text_pole" placeholder="My API" />

            <label class="cxh-label">API 格式</label>
            <select id="cxh_format" class="text_pole">
                <option value="openai">OpenAI 兼容</option>
                <option value="claude">Claude</option>
            </select>

            <label class="cxh-label">端点 Base URL</label>
            <input id="cxh_endpoint" type="text" class="text_pole cxh-mono" placeholder="https://api.example.com/v1" />
            <small class="cxh-hint" id="cxh_endpoint_hint"></small>

            <label class="cxh-label">API Key（仅存于本扩展数据，不写酒馆密钥库）</label>
            <div class="cxh-row">
                <input id="cxh_apikey" type="password" class="text_pole cxh-mono flex1" placeholder="sk-..." autocomplete="off" />
                <div id="cxh_btn_eye" class="menu_button menu_button_icon" title="显示/隐藏">
                    <i class="fa-solid fa-eye"></i>
                </div>
            </div>

            <label class="cxh-label">模型</label>
            <div class="cxh-row cxh-model-row">
                <div class="cxh-model-wrap">
                    <input id="cxh_model_input" type="text" class="text_pole cxh-model-input" placeholder="输入模型名，或点右侧按钮选择" autocomplete="off" />
                    <div id="cxh_model_dropdown" class="cxh-model-dropdown" style="display:none;"></div>
                </div>
                <div id="cxh_model_arrow" class="menu_button menu_button_icon cxh-btn-arrow" title="展开模型列表">
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div id="cxh_btn_fetch_models" class="menu_button cxh-btn-fetch" title="从接口拉取模型列表">
                    <i class="fa-solid fa-rotate"></i> 连接
                </div>
            </div>

            <label class="cxh-label">提示词后处理（由 SillyTavern 原生后端处理）</label>
            <select id="cxh_prompt_pp" class="text_pole" title="发送到 API 前对提示词应用的附加处理">
                <option value="">未选择</option>
                <optgroup label="含工具">
                    <option value="merge_tools">合并相同角色连续的发言（含工具）</option>
                    <option value="semi_tools">半严格（强制对话角色交替）（含工具）</option>
                    <option value="strict_tools">严格（强制对话角色交替、用户最先）（含工具）</option>
                </optgroup>
                <optgroup label="不含工具">
                    <option value="merge">合并相同角色连续的发言</option>
                    <option value="semi">半严格（强制对话角色交替）</option>
                    <option value="strict">严格（强制对话角色交替、用户最先）</option>
                    <option value="single">单一用户消息（无工具）</option>
                </optgroup>
            </select>

            <!-- 状态提示：位于参数配置上方 -->
            <div id="cxh_status" class="cxh-status"></div>

            <!-- 参数配置：点击展开/收起，默认只显示快捷排除 -->
            <div class="cxh-collapse" id="cxh_params_drawer">
                <div class="cxh-collapse-header" id="cxh_params_toggle">
                    <b><i class="fa-solid fa-gears"></i> 参数配置</b>
                    <i class="fa-solid fa-chevron-down cxh-collapse-arrow"></i>
                </div>
                <div class="cxh-collapse-body" style="display:none;">
                    <label class="cxh-label">快捷排除（勾选后该参数不发送，交给 API 默认值）</label>
                    <div id="cxh_exclude_checks" class="cxh-check-grid"></div>

                    <!-- 高级：YAML 附加参数，需再点一次展开 -->
                    <div class="cxh-collapse cxh-collapse-nested" id="cxh_adv_drawer">
                        <div class="cxh-collapse-header" id="cxh_adv_toggle">
                            <span><i class="fa-solid fa-code"></i> 高级：附加参数（YAML）</span>
                            <i class="fa-solid fa-chevron-down cxh-collapse-arrow"></i>
                        </div>
                        <div class="cxh-collapse-body" style="display:none;">
                            <label class="cxh-label">附加请求体参数（YAML 对象）</label>
                            <textarea id="cxh_include_body" class="text_pole textarea_compact cxh-mono" rows="3"
                                placeholder="top_k: 20&#10;repetition_penalty: 1.1"></textarea>

                            <label class="cxh-label">排除参数（YAML 数组，与上方勾选取并集）</label>
                            <textarea id="cxh_exclude_body" class="text_pole textarea_compact cxh-mono" rows="3"
                                placeholder="- frequency_penalty&#10;- presence_penalty"></textarea>

                            <label class="cxh-label">附加请求头（YAML 对象）</label>
                            <textarea id="cxh_include_headers" class="text_pole textarea_compact cxh-mono" rows="3"
                                placeholder="X-Custom-Header: value"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="cxh-actions-row">
                <div id="cxh_btn_save" class="menu_button cxh-action-btn"><i class="fa-solid fa-floppy-disk"></i> 保存</div>
                <div id="cxh_btn_test" class="menu_button cxh-action-btn"><i class="fa-solid fa-comment-dots"></i> 测试连接</div>
            </div>
        </div>
    </div>
</div>
